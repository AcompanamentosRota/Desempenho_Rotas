# Atualiza frontend/data/payload.json e online.json a partir do SAP Datasphere (OData)
# e republica o site quando algo mudou.
#
# Secrets  (Settings > Secrets and variables > Actions > Secrets):
#   DATASPHERE_CLIENT_ID, DATASPHERE_CLIENT_SECRET
# Variables (mesma tela, aba Variables):
#   DATASPHERE_TENANT_URL, DATASPHERE_TOKEN_URL, DATASPHERE_SPACE, DATASPHERE_ASSET
name: Atualizar dados (Datasphere)

on:
  schedule:
    # a cada 15 min, seg-sex, 07:00-18:45 de Brasília (10:00-21:45 UTC).
    # O GitHub pode atrasar execuções agendadas alguns minutos.
    - cron: "*/15 10-21 * * 1-5"
  workflow_dispatch:
    inputs:
      modo:
        description: "O que gerar"
        type: choice
        options: [tudo, so-online]
        default: tudo
      fechamento:
        description: 'Fechamento do mês (ex.: "Setembro/26"); deixe vazio no dia a dia'
        required: false

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      mudou: ${{ steps.gerar.outputs.mudou }}
    env:
      DATASPHERE_TENANT_URL: ${{ vars.DATASPHERE_TENANT_URL }}
      DATASPHERE_TOKEN_URL: ${{ vars.DATASPHERE_TOKEN_URL }}
      DATASPHERE_SPACE: ${{ vars.DATASPHERE_SPACE }}
      DATASPHERE_ASSET: ${{ vars.DATASPHERE_ASSET }}
      DATASPHERE_CLIENT_ID: ${{ secrets.DATASPHERE_CLIENT_ID }}
      DATASPHERE_CLIENT_SECRET: ${{ secrets.DATASPHERE_CLIENT_SECRET }}
      SAIDA_DIR: ../frontend/data
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt

      - name: Gerar JSONs
        id: gerar
        working-directory: backend
        env:
          EVENTO: ${{ github.event_name }}
          MODO: ${{ inputs.modo }}
          FECHAMENTO: ${{ inputs.fechamento }}
        run: |
          ARGS=()
          if [ "$EVENTO" = "workflow_dispatch" ]; then ARGS+=(--forcar); fi
          if [ "$MODO" = "so-online" ]; then ARGS+=(--so-online); fi
          if [ -n "$FECHAMENTO" ]; then ARGS+=(--fechamento "$FECHAMENTO"); fi
          python scripts/gerar.py "${ARGS[@]}"

      - name: Guardar log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-gerar
          path: backend/saida/logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit dos dados
        if: steps.gerar.outputs.mudou == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/data/payload.json frontend/data/online.json
          git diff --cached --quiet && exit 0
          git commit -m "dados: atualização $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1

  publicar:
    needs: gerar
    if: needs.gerar.outputs.mudou == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
