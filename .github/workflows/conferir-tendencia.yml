# Conferência da tendência de volume (critério do SAC) e do modo fechamento do mês, com os dados reais.
# Só manual; não faz commit nem publica o site. Resultado no artifact "conferencia-tendencia":
#   relatorio_tendencia.md  (só totais: sem nomes nem códigos de clientes; a E9 e a E11 vêm depois do gerar.py)
#   e10_mes_anterior.json   (resumo da E10 que a E11 confere contra a chave MES_ANTERIOR: totais e códigos de rota)
#   payload.json, online.json  (gerados com gerar.py --saida, e --hoje se informado)
#   logs/
# Usa os mesmos Secrets/Variables do atualizar-dados.yml.
name: Conferir tendência

on:
  workflow_dispatch:
    inputs:
      hoje:
        description: "Simular a data (AAAA-MM-DD), ex.: 2026-11-01 ou 2026-11-03; vazio = hoje"
        required: false
      rotas:
        description: "Rotas extras de amostra, separadas por vírgula (opcional)"
        required: false

permissions:
  contents: read

jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATASPHERE_TENANT_URL: ${{ vars.DATASPHERE_TENANT_URL }}
      DATASPHERE_TOKEN_URL: ${{ vars.DATASPHERE_TOKEN_URL }}
      DATASPHERE_SPACE: ${{ vars.DATASPHERE_SPACE }}
      DATASPHERE_ASSET: ${{ vars.DATASPHERE_ASSET }}
      DATASPHERE_CLIENT_ID: ${{ secrets.DATASPHERE_CLIENT_ID }}
      DATASPHERE_CLIENT_SECRET: ${{ secrets.DATASPHERE_CLIENT_SECRET }}
      PYTHONIOENCODING: utf-8
      HOJE: ${{ inputs.hoje }}
      ROTAS: ${{ inputs.rotas }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt

      - name: Validar a data
        run: |
          if [ -n "$HOJE" ] && ! [[ "$HOJE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::hoje deve ser AAAA-MM-DD (veio: $HOJE)"; exit 1
          fi

      - name: Relatório
        working-directory: backend
        run: |
          ARGS=(--saida saida/conferencia)
          if [ -n "$HOJE" ]; then ARGS+=(--hoje "$HOJE"); fi
          if [ -n "$ROTAS" ]; then ARGS+=(--rotas "$ROTAS"); fi
          python scripts/conferir_tendencia.py "${ARGS[@]}"

      - name: payload.json e online.json (gerar.py --saida)
        id: gerar
        continue-on-error: true   # reprovação na validação não impede de baixar o relatório
        working-directory: backend
        run: |
          ARGS=(--forcar --saida saida/conferencia)
          if [ -n "$HOJE" ]; then ARGS+=(--hoje "$HOJE"); fi
          INICIO=$(date +%s)
          set +e
          python scripts/gerar.py "${ARGS[@]}"
          CODIGO=$?
          set -e
          DURACAO=$(( $(date +%s) - INICIO ))
          echo "duracao=$DURACAO" >> "$GITHUB_OUTPUT"
          {
            echo ""
            echo "## 10. gerar.py completo"
            echo ""
            echo "\`gerar.py ${ARGS[*]}\`: código de saída $CODIGO em ${DURACAO} s (meta com 16 gerências: abaixo de 120 s)."
            echo ""
            echo "## E6. Tamanho dos JSONs"
            echo ""
            for f in saida/conferencia/payload.json saida/conferencia/online.json; do
              if [ -f "$f" ]; then
                echo "- $(basename "$f"): $(awk -v b="$(stat -c %s "$f")" 'BEGIN{printf "%.2f MB", b/1e6}')"
              else
                echo "- $(basename "$f"): não gerado"
              fi
            done
            echo "(limite de atenção do payload: 8 MB)"
          } >> saida/conferencia/relatorio_tendencia.md
          exit $CODIGO

      - name: E9 e E11 (SEM_COMPRA_MES e MES_ANTERIOR do payload gerado)
        if: always()
        continue-on-error: true
        working-directory: backend
        env:
          DURACAO: ${{ steps.gerar.outputs.duracao }}
          MES_ANTERIOR_S: ${{ steps.gerar.outputs.mes_anterior_s }}
          MES_ANTERIOR_ESPERA_S: ${{ steps.gerar.outputs.mes_anterior_espera_s }}
        run: |
          ARGS=(--saida saida/conferencia --e9 saida/conferencia/payload.json --e11 saida/conferencia/payload.json)
          if [ -n "$DURACAO" ]; then ARGS+=(--e9-duracao "$DURACAO"); fi
          if [ -n "$MES_ANTERIOR_S" ]; then ARGS+=(--e11-tempo "$MES_ANTERIOR_S"); fi
          if [ -n "$MES_ANTERIOR_ESPERA_S" ]; then ARGS+=(--e11-espera "$MES_ANTERIOR_ESPERA_S"); fi
          python scripts/conferir_tendencia.py "${ARGS[@]}"

      - name: Guardar resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conferencia-tendencia
          path: |
            backend/saida/conferencia/
            backend/saida/logs/
          retention-days: 14
          if-no-files-found: warn
