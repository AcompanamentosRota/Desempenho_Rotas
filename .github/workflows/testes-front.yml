# Testes do front (Chromium headless) nos PRs que mexem no painel.
#
# O que faz: instala as dependências de teste fixadas no package.json da raiz, baixa o Chromium do
# Playwright e roda `node --test frontend/tests/front.test.js`. O dado é SINTÉTICO, gerado pelo próprio
# back-end (frontend/tests/sintetico.py), por isso o passo do Python.
#
# NÃO usa rede para dados, NÃO usa Secret nenhum, NÃO consulta o Datasphere, NÃO faz commit e NÃO publica:
# só lê o código e roda testes. O conferencia_real.test.js fica FORA daqui — ele precisa do payload real
# por variável de ambiente (PAYLOAD_REAL/ONLINE_REAL) e continua sendo rodado sob demanda.
name: Testes do front

on:
  # No `pull_request` o GitHub usa o workflow da BRANCH do PR, então um PR que mexa só neste arquivo ou nas
  # versões de teste também se testa. Sem o `package.json` aqui, uma troca de versão como a do jspdf 4.x (o
  # erro que motivou este CI) não rodaria teste nenhum.
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/testes-front.yml"
      - "package.json"
      - "package-lock.json"
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/testes-front.yml"
      - "package.json"
      - "package-lock.json"
  # Depois do merge (o dispatch exige o arquivo na branch padrão) é como se dispara à mão.
  workflow_dispatch:

permissions:
  contents: read

# Vários pushes seguidos no mesmo PR não acumulam rodadas: a anterior é cancelada.
concurrency:
  group: front-${{ github.ref }}
  cancel-in-progress: true

jobs:
  front:
    # ubuntu-24.04 FIXO, nunca `ubuntu-latest`: desde 17/11/2026 o `latest` é a Ubuntu 26.04, e o
    # playwright 1.56.1 (o do package.json) recusa instalar o Chromium nela: "Playwright does not
    # support chromium on ubuntu26.04-x64". Subir o playwright troca o Chromium, e esta suíte compara
    # renderização (PDF real e os "antes x depois"), então isso é outro trabalho, com validação própria.
    runs-on: ubuntu-24.04
    # Medido em 17/11/2026: 43 min 29 s para os 389 testes numa máquina de 8 threads. 60 min dão folga sobre
    # isso e ainda interrompem um travamento. Se o runner passar de 60, o limite precisa subir.
    timeout-minutes: 60
    steps:
      # fetch-depth: 0 = histórico COMPLETO, obrigatório. A suíte compara o front atual com fronts antigos servidos por
      # `git show <commit>:frontend/...` (os "antes x depois" das Partes N, T, O, V, R, X, Z, AA, AC, AG, AI, AK, AM, AN,
      # AP, AQ...). Com o clone raso padrão (depth 1) esses testes NÃO falham: eles PULAM ("# SKIP sem o commit <sha>"), e
      # um teste que pula some do resultado sem ninguém ver — é pior que falhar. Rodada 44172971229 (17/11/2026), ainda
      # com depth 1: 23 pulados, 387 testes em vez de 389 e duas falhas que citavam commit (8620727, ac94f8b).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # O front.test.js chama `python3` para gerar o payload sintético pelo back-end.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt

      # html2canvas, jspdf e exceljs nas MESMAS versões do CONFIG.CDN do config.js (ver package.json).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # TEMPORÁRIO (sai assim que a causa estiver entendida): diagnóstico da medição de texto do quadro Meta | Real | Online.
      # Na rodada 44172971229 três testes mediram "58.620.000" com 44 px onde cabem 42. Imprime, para os <b> do .gMR de um
      # medidor (Gerência G1, dado de frontend/data, 1440 e 360 px): font-family computado, document.fonts.check e status,
      # a largura de "58.620.000" a 12, 9 e 7 px e os @font-face do documento. Inline aqui, e não num arquivo de
      # frontend/tests/, para não deixar rastro no front quando sair. Só lê e imprime; não reprova nada.
      - name: Diagnóstico da fonte (temporário)
        run: |
          node - <<'DIAG' || echo "diagnóstico da fonte falhou (não reprova a rodada)"
          const pw = require('playwright'), fs = require('fs'), path = require('path');
          const FRONT = path.resolve('frontend');
          const TIPOS = {'.html':'text/html','.js':'text/javascript','.css':'text/css','.json':'application/json',
            '.png':'image/png','.woff2':'font/woff2','.webmanifest':'application/manifest+json'};
          (async () => {
            const m = {};
            new Intl.DateTimeFormat('en-US', {timeZone:'America/Sao_Paulo', year:'numeric', month:'2-digit', day:'2-digit'})
              .formatToParts(new Date(Date.now() - 5*3600*1000)).forEach(p => m[p.type] = p.value);
            const sessao = JSON.stringify({perfil:'gc', gc:'G1', dia:`${m.year}-${m.month}-${m.day}`, v:2});
            const browser = await pw.chromium.launch();
            console.log('chromium', browser.version());
            for(const largura of [1440, 360]){
              const ctx = await browser.newContext({viewport: {width: largura, height: 1000}});
              const page = await ctx.newPage();
              const fontes = [];
              page.on('requestfinished', r => { if(/\.woff2$/.test(r.url())) fontes.push(r.url().split('/').pop()); });
              await page.route('https://painel.test/**', rota => {
                const arq = path.join(FRONT, new URL(rota.request().url()).pathname);
                if(!fs.existsSync(arq)) return rota.fulfill({status: 404, body: ''});
                rota.fulfill({status: 200, contentType: TIPOS[path.extname(arq)] || 'application/octet-stream', body: fs.readFileSync(arq)});
              });
              await page.route(/cdnjs\.cloudflare\.com/, r => r.abort());
              await page.addInitScript(s => { try { localStorage.setItem('drotas_sessao', s); } catch(e){} }, sessao);
              await page.goto('https://painel.test/index.html');
              await page.waitForSelector('#exGauges .gMR b', {timeout: 30000}).catch(() => console.log('sem medidor desenhado'));
              for(const momento of ['antes de document.fonts.ready', 'depois de document.fonts.ready']){
                if(momento.startsWith('depois')) await page.evaluate(() => document.fonts.ready);
                const r = await page.evaluate(() => {
                  const b = document.querySelector('#exGauges .gMR b');
                  const cs = b && getComputedStyle(b);
                  const mede = px => { const s = document.createElement('span');
                    s.style.cssText = `position:absolute;visibility:hidden;white-space:nowrap;font-family:${cs.fontFamily};font-weight:${cs.fontWeight};font-size:${px}px`;
                    s.textContent = '58.620.000'; document.body.appendChild(s); const w = s.getBoundingClientRect().width; s.remove(); return +w.toFixed(2); };
                  const caixa = b && b.parentElement.getBoundingClientRect().width;
                  const noB = px => { const t = b.textContent, f = b.style.fontSize; b.textContent = '58.620.000'; b.style.fontSize = px + 'px';
                    const r = {scrollWidth: b.scrollWidth, clientWidth: b.clientWidth}; b.textContent = t; b.style.fontSize = f; return r; };
                  return b ? {fontFamily: cs.fontFamily, fontWeight: cs.fontWeight, fontSizeAplicado: cs.fontSize, dataFitMin: b.dataset.fitMin,
                    check700_12_Inter: document.fonts.check('700 12px Inter'), status: document.fonts.status,
                    larg_58620000: {px12: mede(12), px9: mede(9), px7: mede(7)}, larguraCaixa: +caixa.toFixed(2), noB_7px: noB(7), noB_8px: noB(8),
                    fontFaces: [...document.fonts].map(f => `${f.family} ${f.weight} ${f.status}`)} : null;
                });
                console.log(`[${largura} px · ${momento}]`, JSON.stringify(r, null, 1));
              }
              console.log(`[${largura} px] woff2 baixados:`, fontes.join(', ') || '(nenhum)');
              await ctx.close();
            }
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          DIAG

      - run: node --test frontend/tests/front.test.js
