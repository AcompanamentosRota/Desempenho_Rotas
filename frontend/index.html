<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- versão do código: "dev" aqui; o deploy-pages.yml troca pelo hash de frontend/ (sem data/) e grava versao.json -->
<meta name="versao" content="dev">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Desempenho de Rotas · BAND</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="assets/icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="D. Rota">
<meta name="theme-color" content="#000000">
<link rel="preload" href="assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
</head>
<body class="na-entrada">

<!-- carregando: tela neutra até o payload chegar (ao reabrir um acesso guardado, a entrada não pisca) -->
<div id="carga" class="carga" role="status"><span id="cargaTxt">Carregando…</span></div>

<!-- entrada: Diretoria / Gerência / Supervisão / Rota, por seleção (o sol/lua troca só o fundo desta tela) -->
<div id="entrada" class="entrada" role="dialog" aria-modal="true" aria-labelledby="entTit" hidden>
  <button id="btnTema" class="entTema" type="button" aria-label="Entrada com fundo branco">☀</button>
  <div class="entMeio">
    <div class="entMarca"><img src="assets/helm.png" alt="" width="11" height="19">Comercial Bandeirantes</div>
    <h1 id="entTit">Desempenho de Rotas</h1>
    <div class="entMsg" id="entMsg" role="alert"></div>
    <div class="entBotoes" id="entBotoes">
      <button type="button" data-perfil="dir">DIRETORIA</button>
      <button type="button" data-perfil="gc" aria-haspopup="dialog">GERÊNCIA</button>
      <button type="button" data-perfil="sv" aria-haspopup="dialog">SUPERVISÃO</button>
      <button type="button" data-perfil="rota" aria-haspopup="dialog">ROTA</button>
    </div>
  </div>
  <div class="entRod" id="entRod">Karen Oliveira - Inteligência de Mercado</div>
  <!-- caixa de seleção: a gerência (ou o grupo); na Supervisão e na Rota, depois a lista da gerência escolhida -->
  <div id="entCaixa" class="entCaixa" role="dialog" aria-modal="true" aria-labelledby="entCaixaTit"
       aria-describedby="entCaixaSub" hidden>
    <div class="entPainel">
      <div class="entCab">
        <h2 id="entCaixaTit"></h2>
        <button id="entFechar" class="entFechar" type="button" aria-label="Fechar">×</button>
      </div>
      <div class="entSub" id="entCaixaSub"></div>
      <button id="entVoltar" class="entVoltar" type="button" hidden>← Gerências</button>
      <div class="entOpcoes" id="entOpcoes" role="group" aria-labelledby="entCaixaSub"></div>
    </div>
  </div>
</div>

<!-- versão nova do código: faixa acima do cabeçalho; no PC, no alto do conteúdo, à direita do painel lateral (só com o
     painel aberto; também mostra "Sem conexão") -->
<div id="aviso" class="aviso" role="status" hidden>
  <div class="hd">
    <span id="avisoTxt" class="avisoTxt">Nova versão disponível</span>
    <span class="avisoBtns">
      <button id="avisoAtualizar" class="avisoPri" type="button">Atualizar</button>
      <button id="avisoDepois" type="button">Depois</button>
    </span>
  </div>
</div>

<!-- cabeçalho + filtros e abas: no celular o <aside> não tem caixa (display:contents; a barra continua sticky); no PC
     (>= 1000px) vira o painel lateral fixo à esquerda, recolhível (body.recolhido), com a ordem dos itens por `order` -->
<aside class="lado" id="lado" aria-label="Painel lateral">
<header class="topo">
  <div class="hd">
    <button class="ladoMenu" id="ladoMenu" type="button" aria-controls="lado" aria-expanded="true" aria-label="Recolher o painel"
      title="Recolher o painel"><svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"/></svg></button>
    <div class="marca"><img class="helm" src="assets/helm.png" alt="" width="11" height="19"><span>Comercial Bandeirantes</span></div>
    <h1>Desempenho de Rotas</h1>
    <div class="sub" id="sub"></div>
    <div class="ritmo" id="ritmo"></div>
  </div>
  <!-- ↻ e casa: no canto do topo (celular) ou no rodapé do painel lateral (PC) -->
  <div class="topoBtns">
    <button id="btnRecarga" class="recarga" type="button" aria-label="Atualizar o painel" title="Atualizar o painel">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10a6 6 0 1 1-1.76-4.24" fill="none" stroke="#fff"
        stroke-width="2" stroke-linecap="round"/><path d="M16.5 2.5v4.5H12" fill="none" stroke="#fff" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"/></svg><span class="rotBtn">Atualizar</span>
    </button>
    <button id="btnCasa" class="casa" type="button" aria-label="Voltar para a entrada" title="Entrada">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 9.5 10 3.5l7 6V17h-4.5v-4.5h-5V17H3z" fill="#fff"/></svg><span class="rotBtn">Entrada</span>
    </button>
  </div>
</header>
<nav class="barra" aria-label="Filtros">
  <div class="hd">
    <div class="ladoSec sFil" aria-hidden="true">Filtro</div>
    <div class="filtros">
      <label class="sr-only" for="fgc">Gerência</label><select id="fgc"></select>
      <label class="sr-only" for="fsv">Supervisor</label><select id="fsv"></select>
      <label class="sr-only" for="frota">Rota</label><select id="frota"></select>
    </div>
    <div class="ladoSec sTab" aria-hidden="true">Painéis</div>
    <div class="tabs" role="tablist" aria-label="Grupo de indicadores">
      <button class="tab" role="tab" aria-selected="false" data-g="VOLUME" title="Volume"><svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 3h8l-1 5h-6zM7 8v8a2 2 0 0 0 2 1h2a2 2 0 0 0 2-1V8"/></svg><span>Volume</span></button>
      <button class="tab on" role="tab" aria-selected="true" data-g="ICS_GC" title="ICS GC"><svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="M10 10 6 6"/><circle cx="10" cy="10" r="1.6"/></svg><span>ICS GC</span></button>
      <button class="tab" role="tab" aria-selected="false" data-g="NOVOS_NEG" title="Novos Negócios"><svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v14M3 10h14"/></svg><span>Novos Negócios</span></button>
      <button class="tab" role="tab" aria-selected="false" data-g="INCENTIVO" aria-label="Todos a Bordo" title="Todos a Bordo" hidden><svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.5l2.3 4.7 5.2.8-3.8 3.6.9 5.1-4.6-2.4-4.6 2.4.9-5.1-3.8-3.6 5.2-.8z"/></svg><span>Todos a Bordo</span></button>
    </div>
    <div class="ladoCred" id="ladoCred"></div>
  </div>
</nav>
</aside>

<main class="wrap">
  <!-- cabeçalho da aba: nome + etiqueta do dia (abre a dica); Base e Sem compra só com supervisão ou rota no filtro; a linha
       de resumo (card de ritmo | "puxa a média" | busca); a ficha do cliente; o filtro rápido dos cards -->
  <section class="abaTopo" id="abaTopo" aria-labelledby="abTit">
    <div class="abCab">
      <h2 id="abTit"></h2>
      <button class="pilDia" id="pilDia" type="button" data-dica=""></button>
    </div>
    <div class="cards" id="abBase">
      <div class="card kpi" id="cBase" role="button" tabindex="0"><div class="l">Base total de clientes</div>
        <span class="ki"><svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM2 17c0-3 2.2-5 5-5s5 2 5 5M13.5 9a2.5 2.5 0 1 0 0-5M14 12c2.4.2 4 2 4 5"/></svg></span>
        <div class="n" id="nBase" data-fit="" data-fit-min="16" data-fit-quebra>—</div>
        <div class="x" id="xBase"></div></div>
      <div class="card kpi" id="cSem" role="button" tabindex="0"><div class="l" id="lSem">Sem compra</div>
        <span class="ki"><svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="M5 15 15 5"/></svg></span>
        <div class="n no" id="nSem" data-fit="" data-fit-min="16" data-fit-quebra>—</div>
        <div class="x" id="xSem"></div></div>
    </div>
    <div class="abRes" id="abRes">
      <div class="card kpi mudo" id="cRitmo"><div class="l" id="lRitmo">Ritmo de coberturas</div>
        <span class="ki"><svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 15l5-5 3 3 6-7"/><path d="M13 6h4v4"/></svg></span>
        <div class="n" id="nRitmo" data-fit="" data-fit-min="16" data-fit-quebra>—</div>
        <div class="x" id="xRitmo"></div>
        <div class="st" id="stRitmo" hidden></div></div>
      <div id="puxa"></div>
      <div class="busca">
        <div class="buscaWrap">
          <label class="sr-only" for="q">Buscar cliente ou rede</label>
          <input id="q" type="search" placeholder="Buscar cliente por nome, código ou rede" autocomplete="off" enterkeyhint="search">
          <div id="qSugestoes" class="sugestoes" role="listbox"></div>
        </div>
      </div>
    </div>
    <div id="cli"></div>
    <div class="fchips" id="abFil" role="group" aria-label="Filtrar os cards"></div>
  </section>

  <div id="lista" class="lista"></div>

  <div class="rsBox">
    <div class="rsLbl">Resumo de vendas · incluir</div>
    <div class="rsChips" role="group" aria-label="Blocos do resumo">
      <button data-rsb="vol" aria-pressed="true">Volume</button>
      <button data-rsb="ics" aria-pressed="true">ICS GC</button>
      <button data-rsb="nov" aria-pressed="false">Novos Neg.</button>
    </div>
    <button id="btnResumo">Gerar resumo de vendas</button>
    <!-- Painel de Ritmo em PDF (relatório matinal, só dados reais; js/ritmo.js) -->
    <button id="btnRitmo" type="button">Painel de ritmo</button>
    <span id="rtAviso" class="sr-only" role="status" aria-live="polite"></span>
  </div>

  <footer class="rodape" id="rodape"></footer>
</main>

<div id="rsOverlay" hidden>
  <div class="rs-barra">
    <button class="rs-btn" id="rsVoltar">← Voltar</button>
    <div class="rsChips" role="group" aria-label="Blocos do resumo">
      <button data-rsb="vol" aria-pressed="true">Volume</button>
      <button data-rsb="ics" aria-pressed="true">ICS GC</button>
      <button data-rsb="nov" aria-pressed="false">Novos Neg.</button>
    </div>
    <div class="rs-acoes">
      <button class="rs-btn rs-pri" id="rsLink">Compartilhar link</button>
      <button class="rs-btn" id="rsImg">Baixar PDF</button>
    </div>
    <div id="rsToast" role="status"></div>
  </div>
  <div class="rs-corpo"><div class="rs-box"><div id="rsFolha"></div></div></div>
</div>

<div class="back" id="back"></div>
<div class="drw" id="drw" role="dialog" aria-modal="true" aria-labelledby="dTit">
  <div class="drwCab"><div><h2 id="dTit"></h2><div class="s" id="dSub"></div></div>
    <button class="fechar" id="dX" aria-label="Fechar">×</button></div>
  <div class="corpo" id="dCorpo"></div>
</div>

<script src="js/config.js" defer></script>
<script src="js/nucleo.js" defer></script>
<script src="js/app.js" defer></script>
<script src="js/resumo.js" defer></script>
<script src="js/ritmo.js" defer></script>
<script src="js/main.js" defer></script>
</body>
</html>
